<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PATCHES.JKPG</title>
    <link rel="stylesheet" href="css/main.css" />
    <script src="js/main.js" defer></script>

    <!--Logo font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap"
      rel="stylesheet"
    />

    <!--Text font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <p id="logo">PATCHES.JKPG</p>
      <nav class="navbar" id="nav-links">
        <button id="hamburger-button" class="hamburger-container">
          <img
            src="images/hamburgerMenu.img.png"
            alt="Hamburger menu."
            class="hamburger-img"
          />
        </button>
        <ul class="nav-links">
          <li>
            <a href="index.html" class="nav-item">Home</a>
          </li>

          <li>
            <a href="catalogue.html" class="nav-item">Patches</a>
          </li>
        </ul>
        <div class="cart-icon">
          <a href="shoppingCart.html">
            <img
              id="shoppingCartImg"
              src="images/shoppingBag.img.png"
              alt="Shopping Cart"
              class="nav-item"
            />
          </a>
        </div>
      </nav>
    </header>
    <main>
      <img
        class="main-img"
        src="images/welcome page.img"
        alt="Picture of multiple patches."
      />
      <div class="main-texts">
        <h1 class="heading-welcome">Premium patches for students and brands</h1>
        <p class="text-homepage">
          Discover unique designs for your student overalls or create your own
          custom patches today!
        </p>
      </div>
    </main>
    <footer>
      <h1 id="contacts">Contacts</h1>
      <p id="mail">patches.jpkg@gmail.com</p>
      <figure class="social-media">
        <img src="images/instagram.img.png" alt="Instagram icon" />
        <figcaption>@patches.jkpg</figcaption>
      </figure>
      <figure class="social-media">
        <img src="images/facebook.img.svg" alt="Facebook icon" />
        <figcaption>@patches.jkpg</figcaption>
      </figure>
      <figure class="social-media">
        <img src="images/linkedIn.img.svg" alt="LinkedIn icon" />
        <figcaption>@patches.jkpg</figcaption>
      </figure>

      <p class="copyright">© PATCHES.JKPG 2026</p>
    </footer>
  </body>
</html>
