<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PATCHES.JKPG</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/product.css" />
    <script src="js/addToShoppingCart.js" defer></script>
    <script src="js/main.js" defer></script>

    <!--Logo font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap"
      rel="stylesheet"
    />

    <!--Text font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <button id="hamburger-button" class="hamburger-container">
          <img
            src="images/hamburgerMenu.img.png"
            alt="Hamburger menu."
            class="hamburger-img"
          />
        </button>

        <p id="logo">PATCHES.JKPG</p>

        <ul class="nav-links" id="nav-links">
          <li>
            <a href="index.html" class="nav-item">Home</a>
          </li>

          <li>
            <a href="catalogue.html" class="nav-item">Patches</a>
          </li>
        </ul>
        <div class="cart-wrapper">
          <a href="shoppingCart.html">
            <img
              id="shoppingCartImg"
              src="images/shoppingBag.img.png"
              alt="Shopping Cart"
            />
          </a>
        </div>
      </nav>
    </header>
    <main class="product-container">
      <div class="arrow-row">
        <a href="catalogue.html">
          <img
            id="arrow-back"
            src="images/arrowBack.img.png"
            alt="Return back."
          />
        </a>
      </div>

      <div class="product-content">
        <img
          class="patch-img"
          src="images/patch1.img"
          alt="Image of a patch."
        />
        <figure class="product-details">
          <figcaption>
            <h1 class="item-name">Scout Patch</h1>
            <p class="item-price">30 SEK</p>

            <button id="add-to-cart">Add To Cart</button>
          </figcaption>
        </figure>
      </div>
    </main>
    <footer>
      <p class="copyright">© PATCHES.JKPG 2026</p>
    </footer>
  </body>
</html>
